name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl
      - name: Syntaxpruefung (php -l)
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Migration mit Beispieldaten
        run: php tools/migrate.php --driver sqlite
      - name: Migration erneut ausfuehren (Idempotenz)
        run: php tools/migrate.php --driver sqlite
      - name: Smoke-Tests (Entwicklungsserver)
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php &
          sleep 2
          curl -fsS http://127.0.0.1:8080/login -o login.html
          grep -q "InfoCraft" login.html
          CSRF=$(grep -o 'value="[a-f0-9]*"' login.html | head -n1 | cut -d'"' -f2)
          curl -fsS -L -c cookies.txt -b cookies.txt -d "csrf=$CSRF" -d "user_id=1" http://127.0.0.1:8080/login/demo -o home.html
          grep -q "Willkommen" home.html
          curl -fsS -o /dev/null http://127.0.0.1:8080/modul/sql