name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]
    steps:
      - uses: actions/checkout@v5
      - name: "Vendor-Skripte sicherstellen (highlight/mermaid lokal, kein CDN im Schulnetz)"
        run: |
          set +e
          NEED=0
          HL_SZ=$(wc -c < public/assets/vendor/highlight.min.js 2>/dev/null || echo 0)
          MM_SZ=$(wc -c < public/assets/vendor/mermaid.min.js 2>/dev/null || echo 0)
          if [ "$HL_SZ" -lt 100000 ]; then NEED=1; fi
          if [ "$MM_SZ" -lt 3000000 ]; then NEED=1; fi
          if [ "$NEED" = "1" ]; then
            mkdir -p public/assets/vendor
            if [ "$HL_SZ" -lt 100000 ]; then
              curl -sS --max-time 120 -o public/assets/vendor/highlight.min.js https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/highlight.min.js
              node --check public/assets/vendor/highlight.min.js || echo "::warning::highlight-Download unbrauchbar ($(wc -c < public/assets/vendor/highlight.min.js) Bytes)"
            fi
            if [ "$MM_SZ" -lt 3000000 ]; then
              curl -sS --max-time 180 -o public/assets/vendor/mermaid.min.js https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js
              node --check public/assets/vendor/mermaid.min.js || echo "::warning::mermaid-Download unbrauchbar ($(wc -c < public/assets/vendor/mermaid.min.js) Bytes)"
            fi
            echo "::notice::vendor nach Download: highlight=$(wc -c < public/assets/vendor/highlight.min.js) mermaid=$(wc -c < public/assets/vendor/mermaid.min.js)"
            if [ "${{ matrix.php }}" = "8.3" ] && [ "$(wc -c < public/assets/vendor/mermaid.min.js)" -ge 3000000 ]; then
              git config user.name "infocraft-ci"
              git config user.email "ci@infocraft.invalid"
              git add public/assets/vendor
              git commit -m "vendor: mermaid/highlight lokal bereitgestellt (CI-Runner, kein CDN im Schulnetz noetig)" || true
              git pull --rebase --no-edit origin main || true
              git push origin HEAD:main || echo "::warning::Vendor-Commit konnte nicht gepusht werden (Branch-Schutz?); CDN-Fallback greift"
            fi
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl
      - name: Syntaxpruefung (php -l)
        run: |
          set +e
          OUT=$(find . -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1)
          ST=$?
          echo "$OUT"
          if [ "$ST" -ne 0 ]; then echo "::error::$(echo "$OUT" | grep -m1 'Parse error')"; exit 1; fi
      - name: Migration mit Beispieldaten
        run: php tools/migrate.php --driver sqlite
      - name: Migration erneut ausfuehren (Idempotenz)
        run: php tools/migrate.php --driver sqlite
      - name: Java-Interpreter-Tests (Node)
        run: node tools/java-vm-tests.js
      - name: "UI-Tests Java-IDE (Node, Fake-DOM: alle Buttons klickbar)"
        run: node tools/ui-tests.js
      - name: "Assembler-VM-Tests (Node)"
        run: node tools/asm-vm-tests.js
      - name: Smoke-Tests (Werkstatt, Rechte, Stufen)
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php &> server.log &
          sleep 2
          set +e
          curl() { command curl --max-time 45 "$@"; }
          DB="database/infocraft.sqlite"
          CODE_LOGIN=$(curl -sS -o login.html -w "%{http_code}" -c cookies.txt http://127.0.0.1:8080/login)
          CSRF=$(grep -o 'value="[a-f0-9]*"' login.html | head -n1 | cut -d'"' -f2)
          CODE_DEMO=$(curl -sS -L -o home.html -w "%{http_code}" -b cookies.txt -c cookies.txt -d "csrf=$CSRF" -d "user_id=1" http://127.0.0.1:8080/login/demo)
          CODE_SQL=$(curl -sS -o sql.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/sql)
          grep -q "werkstatt/sql/schule" sql.html && SQLOV_OK=1 || SQLOV_OK=0
          CODE_CODE=$(curl -sS -o code.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/code)
          grep -q "value=\"java\"" code.html && C_JDEF_OK=1 || C_JDEF_OK=0
          grep -q "folder-children" code.html && C_GROUP_OK=1 || C_GROUP_OK=0
          grep -q "new-kind" code.html && C_NEWLANG_OK=1 || C_NEWLANG_OK=0
          grep -q "syncNewForm" code.html && C_NEWFORM_OK=1 || C_NEWFORM_OK=0
          grep -q "ov-topbar" code.html && grep -q "Projekt verteilen" code.html && OV_DISTRT_OK=1 || OV_DISTRT_OK=0
          grep -q "folder-new" code.html && grep -q "Hauptebene" code.html && FOLD_LOCALRT_OK=1 || FOLD_LOCALRT_OK=0
          grep -q "#94a3b8" public/assets/css/style.css && GHOST_CSS_OK=1 || GHOST_CSS_OK=0
          CODE_TASKS=$(curl -sS -o tasks.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/aufgaben)
          CODE_WS=$(curl -sS -o ws.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/sql/shop)
          CODE_SQLTWS=$(curl -sS -L -o sqltws.html -w "%{http_code}" -b cookies.txt -c cookies.txt http://127.0.0.1:8080/werkstatt/sql/schule)
          grep -q "Das Kursangebot" sqltws.html && SQLTWS_OK=1 || SQLTWS_OK=0
          CODE_SQLADV=$(curl -sS -o sqladv.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/sql/abenteuer)
          grep -q "SQL-Abenteuer" sqladv.html && grep -q "adv-card" sqladv.html && grep -q "Raumstation Alpha" sqladv.html && SQLADVHUBRO_OK=1 || SQLADVHUBRO_OK=0
          CODE_SQLADVWS=$(curl -sS -o sqladvws.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/sql/raumstation)
          grep -q "adv-chapter" sqladvws.html && grep -q "Noch verschlossen" sqladvws.html && grep -q "adv-progress" sqladvws.html && SQLADVSTORYRO_OK=1 || SQLADVSTORYRO_OK=0
          # Runde 25 (#198, #199): Fehlversuch bleibt erhalten, Weg-Layout mit Kapitelbildern.
          grep -q "adv-path" sqladvws.html && grep -q "adv-station" sqladvws.html && grep -q "adv-dot" sqladvws.html && grep -q "adv-task" sqladvws.html && grep -q "adv-moment" sqladvws.html && R25PATHRO_OK=1 || R25PATHRO_OK=0
          R25_MISSION=$(grep -o 'mission/[0-9]*' sqladvws.html | head -n1 | cut -d/ -f2)
          R25_CSRF=$(grep -o 'value="[a-f0-9]*"' sqladvws.html | head -n1 | cut -d'"' -f2)
          CODE_R25TRY=$(curl -sS -L -o sqladvtry.html -w "%{http_code}" -b cookies.txt -c cookies.txt --data-urlencode "csrf=$R25_CSRF" --data-urlencode "mission_sql=SELECT * FROM crew" "http://127.0.0.1:8080/werkstatt/sql/raumstation/mission/$R25_MISSION")
          grep -q "adv-feedback" sqladvtry.html && grep -Fq "SELECT * FROM crew" sqladvtry.html && grep -q "Hinweis zu deinem letzten Versuch" sqladvtry.html && R25TRYRO_OK=1 || R25TRYRO_OK=0
          R25_VDB=$(php -r '$pdo = new PDO("sqlite:database/infocraft.sqlite"); echo $pdo->query("SELECT COUNT(*) FROM sql_missions WHERE hint_variants IS NOT NULL")->fetchColumn();')
          [ "$R25_VDB" = "42" ] && R25VDB_OK=1 || R25VDB_OK=0
          # Netzwerk-Werkstatt (#220-#226): Seite, Aktion, Stand-Polling, Export (Lehrkraft-Session cookies.txt)
          CODE_NETW=$(curl -sS -o netw.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/netzwerk)
          grep -q "net-svg" netw.html && grep -q "Netzwerk-Werkstatt" netw.html && grep -q "net-boot" netw.html && NET_PAGE_OK=1 || NET_PAGE_OK=0
          NETCSRF=$(grep -o 'data-csrf="[a-f0-9]*"' netw.html | head -n1 | cut -d'"' -f2)
          curl -sS -b cookies.txt -o netact.json -d "aktion=addDevice" --data-urlencode 'params={"type":"webserver","name":"CI Webserver"}' -d "csrf=$NETCSRF" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"ok":true' netact.json && grep -q '192.168.0.2' netact.json && grep -q 'CI Webserver' netact.json && NET_ADD_OK=1 || NET_ADD_OK=0
          curl -sS -b cookies.txt -o netpub.json --data-urlencode 'params={"server":"n1","title":"CI Zeitung","domain":"ci-zeitung.test","html":"<h1>CI</h1>"}' -d "csrf=$NETCSRF" -d "aktion=savePage" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          NETPGID=$(php -r '$n = json_decode((new PDO("sqlite:database/infocraft.sqlite"))->query("SELECT content FROM net_networks WHERE class_id IS NULL AND owner_id = 1")->fetchColumn(), true); foreach ($n["pages"] as $p) { if ($p["title"] === "CI Zeitung") { echo $p["id"]; } }')
          curl -sS -b cookies.txt -o netpub2.json --data-urlencode "params={\"id\":\"$NETPGID\"}" -d "csrf=$NETCSRF" -d "aktion=publishPage" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"ok":true' netpub.json && grep -q '"ok":true' netpub2.json && NET_PAGEACT_OK=1 || NET_PAGEACT_OK=0
          curl -sS -o netstand.json -b cookies.txt http://127.0.0.1:8080/werkstatt/netzwerk/stand
          grep -q '192.168.0.2' netstand.json && grep -q 'ci-zeitung.test' netstand.json && NET_STAND_OK=1 || NET_STAND_OK=0
          CODE_NETEXP=$(curl -sS -o netexp.json -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/netzwerk/export)
          grep -q '"devices"' netexp.json && grep -q 'CI Zeitung' netexp.json && NET_EXPORT_OK=1 || NET_EXPORT_OK=0
          NETDB=$(sqlite3 "$DB" "SELECT COUNT(*) FROM net_networks")
          [ "$NETDB" = "1" ] && NET_DB_OK=1 || NET_DB_OK=0
          # Runde 30 (#229-#232): Beispielseite, HTML-Bruecke, Stufen-Schalter, Drucker.
          curl -sS -b cookies.txt -o netex.json --data-urlencode 'params={"server":"n1","example":"sport"}' -d "csrf=$NETCSRF" -d "aktion=loadExample" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"ok":true' netex.json && grep -q 'Sportclub Eichenwald' netex.json && NET_EXRO_OK=1 || NET_EXRO_OK=0
          NETPG2ID=$(php -r '$n = json_decode((new PDO("sqlite:database/infocraft.sqlite"))->query("SELECT content FROM net_networks WHERE class_id IS NULL AND owner_id = 1")->fetchColumn(), true); foreach ($n["pages"] as $p) { if ($p["title"] === "Sportclub Eichenwald") { echo $p["id"]; } }')
          curl -sS -b cookies.txt -o nettohtml.json --data-urlencode "params={\"id\":\"$NETPG2ID\"}" -d "csrf=$NETCSRF" -d "aktion=toHtml" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"ok":true' nettohtml.json && grep -q 'werkstatt/html/' nettohtml.json && grep -q '"url":"' nettohtml.json && NET_TOHTML_OK=1 || NET_TOHTML_OK=0
          NETPROJID=$(grep -o 'werkstatt/html/[0-9]*' nettohtml.json | head -n1 | cut -d/ -f3)
          curl -sS -b cookies.txt -o netfromhtml.json --data-urlencode "params={\"server\":\"n1\",\"projectId\":\"$NETPROJID\"}" -d "csrf=$NETCSRF" -d "aktion=fromHtml" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"ok":true' netfromhtml.json && grep -q 'Sportclub Eichenwald' netfromhtml.json && grep -q 'eichenwald-sport.net' netfromhtml.json && NET_FROMHTML_OK=1 || NET_FROMHTML_OK=0
          curl -sS -b cookies.txt -o netlvl.json --data-urlencode 'params={"level":"2"}' -d "csrf=$NETCSRF" -d "aktion=setLevel" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"ok":true' netlvl.json && grep -q '"level":2' netlvl.json && NET_LEVELRO_OK=1 || NET_LEVELRO_OK=0
          curl -sS -b cookies.txt -o netlvl1.json --data-urlencode 'params={"level":"1"}' -d "csrf=$NETCSRF" -d "aktion=setLevel" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"level":1' netlvl1.json && NET_LEVEL1RO_OK=1 || NET_LEVEL1RO_OK=0
          curl -sS -b cookies.txt -o netpr.json --data-urlencode 'params={"type":"printer","name":"CI Drucker"}' -d "csrf=$NETCSRF" -d "aktion=addDevice" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"ok":true' netpr.json && grep -q 'CI Drucker' netpr.json && NET_PRRO_OK=1 || NET_PRRO_OK=0
          curl -sS -b cookies.txt -o netprint.json --data-urlencode 'params={"printer":"n2","url":"zeitung.test"}' -d "csrf=$NETCSRF" -d "aktion=printPage" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"ok":true' netprint.json && grep -q 'druckt' netprint.json && NET_PRINTRO_OK=1 || NET_PRINTRO_OK=0
          # Runde 32 (#218): Geraete-Logs, DHCP-Vergabe, Webserver-Log mit Statuscode.
          curl -sS -b cookies.txt -o netpc.json --data-urlencode 'params={"type":"pc","name":"CI PC"}' -d "csrf=$NETCSRF" -d "aktion=addDevice" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"ok":true' netpc.json && grep -q 'CI PC' netpc.json && grep -q 'IP-Vergabe (DHCP)' netpc.json && NET_PCD_OK=1 || NET_PCD_OK=0
          curl -sS -b cookies.txt -o netbrow.json --data-urlencode 'params={"who":"CI PC","url":"http://192.168.0.2/","server":"n1","ip":"192.168.0.3","code":"200","path":"/"}' -d "csrf=$NETCSRF" -d "aktion=browse" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"ok":true' netbrow.json && grep -q 'HTTP 200' netbrow.json && grep -q '"code":200' netbrow.json && NET_DLOG_OK=1 || NET_DLOG_OK=0
          curl -sS -b cookies.txt -o netreset.json --data-urlencode 'params={}' -d "csrf=$NETCSRF" -d "aktion=reset" http://127.0.0.1:8080/werkstatt/netzwerk/aktion
          grep -q '"ok":true' netreset.json && grep -q '192.168.0.2' netreset.json && NET_RESET_DB_OK=0 || NET_RESET_DB_OK=1
          CODE_HTML=$(curl -sS -o html.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/html)
          # Navigation: HTML-Werkstatt steht ganz oben (#57)
          NAVPOS_H=$(grep -bo "HTML-Werkstatt" home.html | head -n1 | cut -d: -f1)
          NAVPOS_S=$(grep -bo "SQL-Werkstatt" home.html | head -n1 | cut -d: -f1)
          [ -n "$NAVPOS_H" ] && [ -n "$NAVPOS_S" ] && [ "$NAVPOS_H" -lt "$NAVPOS_S" ] && NAV_HTML_OK=1 || NAV_HTML_OK=0
          grep -q "folder-item" html.html && H_FOLD_OK=1 || H_FOLD_OK=0
          PYID=$(sqlite3 "$DB" "SELECT id FROM projects WHERE title = 'Begrüßung mit Python'")
          CODE_PYED=$(curl -sS -o pyed.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/code/$PYID)
          grep -q "run-python" pyed.html && PY_RUN_OK=1 || PY_RUN_OK=0
          grep -q "hlwrap" pyed.html && HL_CODE_OK=1 || HL_CODE_OK=0
          CSRF2=$(grep -o 'value="[a-f0-9]*"' ws.html | head -n1 | cut -d'"' -f2)
          grep -q "hlwrap" ws.html && HL_SQL_OK=1 || HL_SQL_OK=0
          grep -q 'data-hl="sql"' ws.html && HL_SQLHL_OK=1 || HL_SQLHL_OK=0
          grep -q 'data-ac="sql"' ws.html && AC_SQL_OK=1 || AC_SQL_OK=0
          grep -q 'data-tables="[^"]*produkte' ws.html && AC_SQLTB_OK=1 || AC_SQLTB_OK=0
          curl -sS -L -b cookies.txt -c cookies.txt -o query.html --data-urlencode "csrf=$CSRF2" --data-urlencode "sql=SELECT COUNT(*) AS n FROM produkte" http://127.0.0.1:8080/werkstatt/sql/shop
          grep -q 'data-result="ok"' query.html && QUERY_OK=1 || QUERY_OK=0
          CODE_SQLAPP_SHOP=$(curl -sS -L -o wsapp.html -w "%{http_code}r%{num_redirects}" -b cookies.txt http://127.0.0.1:8080/werkstatt/sql/shop/app)
          grep -q "phone-frame" wsapp.html && SQLAPP_SHOP_OK=1 || SQLAPP_SHOP_OK=0
          grep -q "App-Ansicht" ws.html && SQLAPPLINK_OK=1 || SQLAPPLINK_OK=0
          grep -q 'class="hlwrap sql" data-hl="sql" data-ac="sql"' ws.html && SQLNEST_OK=1 || SQLNEST_OK=0
          grep -q 'data-hl="sql">' ws.html && SQLNEST_BAD=1 || SQLNEST_BAD=0
          grep -q "ic-ghost" public/assets/js/app.js && GHOSTJS_OK=1 || GHOSTJS_OK=0
          grep -q "repl-gutter" public/assets/js/app.js && GUTTER_GUARD_OK=1 || GUTTER_GUARD_OK=0
          grep -q "ide > .gfx-dock" public/assets/css/style.css && GFXDOCK_CSS_OK=1 || GFXDOCK_CSS_OK=0
          grep -q "edAcSession" public/assets/js/java-vm.js && EDAC_MEM_OK=1 || EDAC_MEM_OK=0
          grep -q "pageXOffset" public/assets/js/java-vm.js && ACSCROLL_OK=1 || ACSCROLL_OK=0
          grep -q "wireDbConsole" public/assets/js/java-vm.js && DBCONS_OK=1 || DBCONS_OK=0
          grep -q "restoreClassDiagramHeader" public/assets/js/app.js && DIAG_RESTORE_OK=1 || DIAG_RESTORE_OK=0
          grep -q "edAcFallbackScan" public/assets/js/java-vm.js && EDAC_FB_OK=1 || EDAC_FB_OK=0
          grep -q "Noch keine Abfrage" public/assets/js/java-vm.js && DBCONS_DELEG_OK=1 || DBCONS_DELEG_OK=0
          grep -q "repl-edit:focus-within" public/assets/css/style.css && REPL_FOCUS_OK=1 || REPL_FOCUS_OK=0
          grep -q "elementFromPoint" public/assets/js/app.js && DBCONSFIX_OK=1 || DBCONSFIX_OK=0
          grep -q "__icDbRunDone" public/assets/js/java-vm.js && DBRUN_GUARD_OK=1 || DBRUN_GUARD_OK=0
          grep -Fq ".gfx-dock .gfx-window { width: fit-content; max-width: 100%; margin: 0 auto; }" public/assets/css/style.css && GFXFIT_OK=1 || GFXFIT_OK=0
          grep -q "host.clientWidth" public/assets/js/java-vm.js && GFXFITJS_OK=1 || GFXFITJS_OK=0
          grep -Fq ".repl-edit > .hlwrap { flex: 1; min-width: 0; }" public/assets/css/style.css && REPLW_OK=1 || REPLW_OK=0
          grep -q "DOMContentLoaded" public/assets/js/java-vm.js && BOOTDOM_OK=1 || BOOTDOM_OK=0
          grep -q "setAttribute('rows'" public/assets/js/java-vm.js && REPLGROW_OK=1 || REPLGROW_OK=0
          grep -Fq ".repl-edit .hlwrap > pre" public/assets/css/style.css && REPLOVL_OK=1 || REPLOVL_OK=0
          grep -q "ibook-editor" public/assets/js/app.js && IBK_JS_OK=1 || IBK_JS_OK=0
          grep -q "icv-stage" public/assets/js/app.js && IBK_CVJS_OK=1 || IBK_CVJS_OK=0
          grep -q "icv-mode-draw" public/assets/css/style.css && IBK_CVCSS_OK=1 || IBK_CVCSS_OK=0
          grep -q "icv-del" public/assets/js/app.js && IBK_DEL_OK=1 || IBK_DEL_OK=0
          grep -q "Backspace" public/assets/js/app.js && IBK_DELKEY_OK=1 || IBK_DELKEY_OK=0
          grep -q "fitTa" public/assets/js/app.js && IBK_FITTA_OK=1 || IBK_FITTA_OK=0
          grep -q "itemDivs" public/assets/js/app.js && IBK_SELNB_OK=1 || IBK_SELNB_OK=0
          grep -Fq ".icv-selected .icv-del" public/assets/css/style.css && IBK_DELCSS_OK=1 || IBK_DELCSS_OK=0
          grep -Fq ".ibook-topnav { margin-bottom: 8px; justify-content: flex-start" public/assets/css/style.css && IBK_NAVL_OK=1 || IBK_NAVL_OK=0
          grep -q "ibook-distribute-details" templates/ibook_distribute_panel.php && grep -q "ibook_distribute_panel.php" templates/ibook_page.php && IBK_DIST_OK=1 || IBK_DIST_OK=0
          grep -Fq "?lesen=1" templates/ibook_page.php && IBK_PREV_OK=1 || IBK_PREV_OK=0
          grep -q "HTTP_X_IC_AUTOSAVE" src/Controllers/InfoBookController.php && IBK_ASAVE_OK=1 || IBK_ASAVE_OK=0
          grep -q "Automatisch gespeichert" public/assets/js/app.js && IBK_ASAVEJS_OK=1 || IBK_ASAVEJS_OK=0
          ! grep -q "Seite speichern" templates/ibook_page.php && IBK_NOBTN_OK=1 || IBK_NOBTN_OK=0
          grep -q "icv-rs-nw" public/assets/css/style.css && IBK_4C_OK=1 || IBK_4C_OK=0
          grep -q "i.ytimg.com" public/assets/js/app.js && IBK_YT_OK=1 || IBK_YT_OK=0
          grep -q "icv-video-preview" public/assets/js/app.js && IBK_VID_OK=1 || IBK_VID_OK=0
          grep -q "H5P" public/assets/js/app.js && IBK_H5PJS_OK=1 || IBK_H5PJS_OK=0
          grep -q "h5p.com" src/Models/InfoBook.php && IBK_H5PPHP_OK=1 || IBK_H5PPHP_OK=0
          grep -q "IC_RUN_CODE" public/assets/js/app.js && IBK_CODEPHP_OK=1 || IBK_CODEPHP_OK=0
          grep -q "IC_DB_RUN" public/assets/js/app.js && IBK_DBPHP_OK=1 || IBK_DBPHP_OK=0
          grep -q "IC_RENDER_DIAGRAM" public/assets/js/app.js && IBK_DIAGPHP_OK=1 || IBK_DIAGPHP_OK=0
          grep -q "mermaid" templates/ibook_page.php && IBK_DIAGTPL_OK=1 || IBK_DIAGTPL_OK=0
