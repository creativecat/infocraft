          grep -q "restoreClassDiagramHeader" public/assets/js/app.js && DIAG_RESTORE_OK=1 || DIAG_RESTORE_OK=0
          grep -q "edAcFallbackScan" public/assets/js/java-vm.js && EDAC_FB_OK=1 || EDAC_FB_OK=0
