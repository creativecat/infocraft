name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]
    steps:
      - uses: actions/checkout@v5
      - name: "Vendor-Skripte sicherstellen (highlight/mermaid lokal, kein CDN im Schulnetz)"
        run: |
          set +e
          NEED=0
          HL_SZ=$(wc -c < public/assets/vendor/highlight.min.js 2>/dev/null || echo 0)
          MM_SZ=$(wc -c < public/assets/vendor/mermaid.min.js 2>/dev/null || echo 0)
          if [ "$HL_SZ" -lt 100000 ]; then NEED=1; fi
          if [ "$MM_SZ" -lt 3000000 ]; then NEED=1; fi
          if [ "$NEED" = "1" ]; then
            mkdir -p public/assets/vendor
            if [ "$HL_SZ" -lt 100000 ]; then
              curl -sS --max-time 120 -o public/assets/vendor/highlight.min.js https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/highlight.min.js
              node --check public/assets/vendor/highlight.min.js || echo "::warning::highlight-Download unbrauchbar ($(wc -c < public/assets/vendor/highlight.min.js) Bytes)"
            fi
            if [ "$MM_SZ" -lt 3000000 ]; then
              curl -sS --max-time 180 -o public/assets/vendor/mermaid.min.js https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js
              node --check public/assets/vendor/mermaid.min.js || echo "::warning::mermaid-Download unbrauchbar ($(wc -c < public/assets/vendor/mermaid.min.js) Bytes)"
            fi
            echo "::notice::vendor nach Download: highlight=$(wc -c < public/assets/vendor/highlight.min.js) mermaid=$(wc -c < public/assets/vendor/mermaid.min.js)"
            if [ "${{ matrix.php }}" = "8.3" ] && [ "$(wc -c < public/assets/vendor/mermaid.min.js)" -ge 3000000 ]; then
              git config user.name "infocraft-ci"
              git config user.email "ci@infocraft.invalid"
              git add public/assets/vendor
              git commit -m "vendor: mermaid/highlight lokal bereitgestellt (CI-Runner, kein CDN im Schulnetz noetig)" || true
              git pull --rebase --no-edit origin main || true
              git push origin HEAD:main || echo "::warning::Vendor-Commit konnte nicht gepusht werden (Branch-Schutz?); CDN-Fallback greift"
            fi
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl
      - name: Syntaxpruefung (php -l)
        run: |
          set +e
          OUT=$(find . -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1)
          ST=$?
          echo "$OUT"
          if [ "$ST" -ne 0 ]; then echo "::error::$(echo "$OUT" | grep -m1 'Parse error')"; exit 1; fi
      - name: Migration mit Beispieldaten
        run: php tools/migrate.php --driver sqlite
      - name: Migration erneut ausfuehren (Idempotenz)
        run: php tools/migrate.php --driver sqlite
      - name: Java-Interpreter-Tests (Node)
        run: node tools/java-vm-tests.js
      - name: "UI-Tests Java-IDE (Node, Fake-DOM: alle Buttons klickbar)"
        run: node tools/ui-tests.js
      - name: "Assembler-VM-Tests (Node)"
        run: node tools/asm-vm-tests.js
      - name: Smoke-Tests (Werkstatt, Rechte, Stufen)
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php &> server.log &
          sleep 2
          set +e
          curl() { command curl --max-time 45 "$@"; }
          DB="database/infocraft.sqlite"
          CODE_LOGIN=$(curl -sS -o login.html -w "%{http_code}" -c cookies.txt http://127.0.0.1:8080/login)
          CSRF=$(grep -o 'value="[a-f0-9]*"' login.html | head -n1 | cut -d'"' -f2)
          CODE_DEMO=$(curl -sS -L -o home.html -w "%{http_code}" -b cookies.txt -c cookies.txt -d "csrf=$CSRF" -d "user_id=1" http://127.0.0.1:8080/login/demo)
          CODE_SQL=$(curl -sS -o sql.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/sql)
          grep -q "werkstatt/sql/schule" sql.html && SQLOV_OK=1 || SQLOV_OK=0
          CODE_CODE=$(curl -sS -o code.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/code)
          grep -q "value=\"java\"" code.html && C_JDEF_OK=1 || C_JDEF_OK=0
          grep -q "folder-children" code.html && C_GROUP_OK=1 || C_GROUP_OK=0
          grep -q "new-lang" code.html && C_NEWLANG_OK=1 || C_NEWLANG_OK=0
          grep -q "syncNewForm" code.html && C_NEWFORM_OK=1 || C_NEWFORM_OK=0
          grep -q "#94a3b8" public/assets/css/style.css && GHOST_CSS_OK=1 || GHOST_CSS_OK=0
          CODE_TASKS=$(curl -sS -o tasks.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/aufgaben)
          CODE_WS=$(curl -sS -o ws.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/sql/shop)
          CODE_SQLTWS=$(curl -sS -L -o sqltws.html -w "%{http_code}" -b cookies.txt -c cookies.txt http://127.0.0.1:8080/werkstatt/sql/schule)
          grep -q "Das Kursangebot" sqltws.html && SQLTWS_OK=1 || SQLTWS_OK=0
          CODE_HTML=$(curl -sS -o html.html -w "%{http_code}" -b cookies.txt http://127.0.0.1:8080/werkstatt/html)
          # Navigation: HTML-Werkstatt steht ganz oben (#57)
          NAVPOS_H=$(grep -bo "HTML-Werkstatt" home.html | head -n1 | cut -d: -f1)
          NAVPOS_S=$(grep -bo "SQL-Werkstatt" home.html | head -n1 | cut -d: -f1)
          [ -n "$NAVPOS_H" ] && [ -n "$NAVPOS_S" ] && [ "$NAVPOS_H" -lt "$NAVPOS_S" ] && NAV_HTML_OK=1 || NAV_HTML_OK=0
          grep -q "folder-item" html.html && H_FOLD_OK=1 || H_FOLD_OK=0
